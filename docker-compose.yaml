services:
  muzlovar:
    image: ghcr.io/zamyatinmn/muzlovar:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      MUZLOVAR_PORT: "8765"
      MUZLOVAR_USERNAME: "${MUZLOVAR_USERNAME:-}"
      MUZLOVAR_PASSWORD: "${MUZLOVAR_PASSWORD:-}"
      MUZLOVAR_SUBSONIC_URL: "${MUZLOVAR_SUBSONIC_URL:-}"
      MUZLOVAR_SUBSONIC_USER: "${MUZLOVAR_SUBSONIC_USER:-}"
      MUZLOVAR_SUBSONIC_PASSWORD: "${MUZLOVAR_SUBSONIC_PASSWORD:-}"
    volumes:
      - muzlovar_rules:/rules
      - muzlovar_playlists:/playlists
      - muzlovar_trash:/trash
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  muzlovar_rules:
    name: muzlovar_rules
  muzlovar_playlists:
    name: muzlovar_playlists
  muzlovar_trash:
    name: muzlovar_trash
